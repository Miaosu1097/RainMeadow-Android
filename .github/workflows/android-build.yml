name: Rain Meadow Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_revision:
        description: Game snapshot revision
        type: string
      build:
        description: Build mode when no release tag is supplied
        type: choice
        default: verify
        options: [verify, package]
      release_tag:
        description: Existing tag at the selected commit to create a draft Release
        type: string

permissions:
  contents: read

concurrency:
  group: rain-meadow-android-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.release_tag }}
    uses: ./.github/workflows/android-run.yml
    with:
      game_revision: ${{ inputs.game_revision || vars.RAIN_MEADOW_GAME_REVISION || '1.10' }}
      build: ${{ inputs.build || 'verify' }}
    secrets:
      assemblies_token: ${{ secrets.RAIN_MEADOW_ASSEMBLIES_TOKEN }}

  draft-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/android-run.yml
    with:
      game_revision: ${{ inputs.game_revision || vars.RAIN_MEADOW_GAME_REVISION || '1.10' }}
      build: package
      release_tag: ${{ inputs.release_tag }}
    secrets:
      assemblies_token: ${{ secrets.RAIN_MEADOW_ASSEMBLIES_TOKEN }}
