name: Rain Meadow Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_revision:
        description: Game snapshot directory under libs/game
        type: string
      build:
        description: Managed verification or complete Android mod ZIP
        type: choice
        default: verify
        options: [verify, package]

permissions:
  contents: read

concurrency:
  group: rain-meadow-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, rain-meadow-build]
    timeout-minutes: 40
    env:
      GAME_REVISION: ${{ inputs.game_revision || vars.RAIN_MEADOW_GAME_REVISION || '1.10' }}
      BUILD_MODE: ${{ inputs.build || 'verify' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: false
          persist-credentials: false
      - name: Verify the source-only checkout
        run: python3 -IB tools/rain-meadow/check_source.py
      - name: Resolve the pinned game snapshot
        id: game
        run: |
          commit=$(python3 -IB tools/rain-meadow/ci_inputs.py game-commit "$GAME_REVISION")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the private assembly snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.RAIN_MEADOW_ASSEMBLIES_REPOSITORY || 'MISTAKE568/Rain-Meadow-Android-Assemblies' }}
          token: ${{ secrets.RAIN_MEADOW_ASSEMBLIES_TOKEN }}
          ref: ${{ steps.game.outputs.commit }}
          path: work/rain-meadow/assembly-source
          sparse-checkout: ${{ env.GAME_REVISION }}
          persist-credentials: false
      - name: Compile for the selected game revision
        env:
          RAIN_MEADOW_GAME_ARCHIVE: work/rain-meadow/assembly-source/${{ env.GAME_REVISION }}/Managed.zip
        run: sh tools/rain-meadow/ci.sh "$BUILD_MODE" "$GAME_REVISION"
